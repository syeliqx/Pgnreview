<title>PGN Game Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: board with eval bar on the left, a scoresheet-style review panel on the right; stacks on phones. */
:root{
  --bg:#eceff0;--surface:#f8fafa;--ink:#172126;--muted:#5a6a70;--line:#d2dadd;--accent:#1f6f78;--accent-ink:#ffffff;
  --sq-l:#e3eae7;--sq-d:#7aa098;--hl:rgba(232,196,44,.5);--arrow:#2f9e6a;--arrow2:#3c7be0;--arrow3:#d08b1d;
  --p-w:#fbfaf4;--p-ws:#1a2428;--p-b:#1a2428;--p-bs:#f1efe6;
  --bar-w:#f4f6f5;--bar-b:#27353b;--g-bg:#2a383e;--g-fill:#eef2f1;
  --c-best:#26925f;--c-excellent:#4a9d57;--c-good:#7d9870;--c-book:#a07a4a;--c-forced:#7b8a90;
  --c-inacc:#cf9a0e;--c-mistake:#dd7424;--c-blunder:#d23b3a;--c-pending:#c3ccd0;
  --font-d:"Bricolage Grotesque",system-ui,sans-serif;
  --font-b:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1517;--surface:#172024;--ink:#e6eeee;--muted:#8fa1a6;--line:#27343a;--accent:#5bb9c2;--accent-ink:#071417;
    --sq-l:#b8c9c4;--sq-d:#4e7871;--hl:rgba(232,196,44,.42);--arrow:#43c28a;--arrow2:#6ea0f5;--arrow3:#e8b04a;
    --bar-w:#eef2f1;--bar-b:#0a0f11;--g-bg:#0a1012;--g-fill:#cfdada;
    --c-best:#43c28a;--c-excellent:#66c27a;--c-good:#98b88b;--c-book:#c79f6c;--c-forced:#9fb0b6;
    --c-inacc:#eec04a;--c-mistake:#f09550;--c-blunder:#f26a67;--c-pending:#3a484e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1517;--surface:#172024;--ink:#e6eeee;--muted:#8fa1a6;--line:#27343a;--accent:#5bb9c2;--accent-ink:#071417;
  --sq-l:#b8c9c4;--sq-d:#4e7871;--hl:rgba(232,196,44,.42);--arrow:#43c28a;--arrow2:#6ea0f5;
  --bar-w:#eef2f1;--bar-b:#0a0f11;--g-bg:#0a1012;--g-fill:#cfdada;
  --c-best:#43c28a;--c-excellent:#66c27a;--c-good:#98b88b;--c-book:#c79f6c;--c-forced:#9fb0b6;
  --c-inacc:#eec04a;--c-mistake:#f09550;--c-blunder:#f26a67;--c-pending:#3a484e;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.45;
  padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1160px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.top>div{min-width:0}
h1{font-family:var(--font-d);font-weight:650;font-size:24px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.meta{margin:4px 0 0;color:var(--muted);font-size:13px}
.opn{color:var(--ink);font-weight:500}
.loader{flex:1 1 360px;max-width:640px;min-width:0}
.loader summary{list-style:none;cursor:pointer;display:inline-block;float:right;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:500}
.loader summary::-webkit-details-marker{display:none}
.loader[open] summary{float:none;display:inline-block;margin-bottom:10px}
.loader-body{clear:both;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
textarea{width:100%;min-height:140px;resize:vertical;font-family:var(--font-m);font-size:12px;line-height:1.5;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row label{color:var(--muted);font-size:13px}
.btn{padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
dialog#aidlg{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;max-width:440px;width:calc(100% - 32px);padding:16px}
dialog#aidlg::backdrop{background:rgba(0,0,0,.5)}
.aiform label{display:block;margin:10px 0 0;font-size:13px;font-weight:600}
.aiform input,.aiform select{display:block;width:100%;margin-top:4px;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit;font:inherit;box-sizing:border-box}
.aibtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.aibox{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:8px}
.aibox p{margin:6px 0 0;line-height:1.5}
.aibox .clabel{margin-bottom:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:100%}
.err{margin:0;color:var(--c-blunder);font-size:13px}
.hint{margin:0;color:var(--muted);font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.main{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:24px;align-items:start}
.left,.right{min-width:0}
.boardrow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px}
.board svg{display:block;width:100%;height:auto;border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.selsq{fill:rgba(60,123,224,.45)}
.dst{fill:rgba(20,30,34,.35);pointer-events:none}
.dstc{fill:none;stroke:rgba(20,30,34,.35);stroke-width:9;pointer-events:none}
.sq-l{fill:var(--sq-l)}.sq-d{fill:var(--sq-d)}.hl{fill:var(--hl)}
.co{font:600 19px var(--font-m);pointer-events:none}
.on-l{fill:var(--sq-l)}.on-d{fill:var(--sq-d)}
.pc{font-family:"Noto Sans Symbols 2","Segoe UI Symbol","Apple Symbols","DejaVu Sans",serif;font-size:82px;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.pc.w{fill:var(--p-w);stroke:var(--p-ws);stroke-width:5px}
.pc.b{fill:var(--p-b);stroke:var(--p-bs);stroke-width:2px}
.arrow{opacity:.88;pointer-events:none}
.arrow line{stroke-linecap:butt}
.a-best line{stroke:var(--arrow)}.a-best polygon{fill:var(--arrow)}
.a-hint line{stroke:var(--arrow2)}.a-hint polygon{fill:var(--arrow2)}
.a-c1 line{stroke:var(--arrow)}.a-c1 polygon{fill:var(--arrow)}
.a-c2 line{stroke:var(--arrow2)}.a-c2 polygon{fill:var(--arrow2)}.a-c2{opacity:.7}
.a-c3 line{stroke:var(--arrow3)}.a-c3 polygon{fill:var(--arrow3)}.a-c3{opacity:.6}
.badge circle{fill:var(--k)}
.badge text{fill:#fff;font:700 17px var(--font-b);pointer-events:none}
.evalbar{position:relative;border-radius:3px;overflow:hidden;background:var(--bar-b);align-self:stretch}
.evalbar .fill{position:absolute;left:0;right:0;bottom:0;background:var(--bar-w);transition:height .3s ease}
.evalbar.flip .fill{top:0;bottom:auto}
.evallab{position:absolute;left:0;right:0;text-align:center;font:500 10px var(--font-m);font-variant-numeric:tabular-nums}
.evallab.at-bot{bottom:4px}.evallab.at-top{top:4px}
.evallab.dk{color:#1b2529}.evallab.lt{color:#f1f4f3}
.strip{display:flex;align-items:center;gap:8px;padding:7px 0 7px 42px;min-height:36px}
.strip .chip{width:12px;height:12px;border-radius:2px;border:1px solid var(--ink);flex:none}
.strip .chip.w{background:#fbfaf4}.strip .chip.b{background:#1a2428}
.pname{font-weight:600;min-width:0;overflow-wrap:anywhere}
.elo{font:400 12px var(--font-m);color:var(--muted)}
.mat{font:500 12px var(--font-m);color:var(--muted)}
.rtag{margin-left:auto;font:600 13px var(--font-m);color:var(--muted)}
.strip.to-move .pname::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:7px;vertical-align:middle}
.controls{display:flex;flex-wrap:wrap;gap:6px;padding-left:42px;margin-top:4px}
.controls .btn{min-width:42px;padding:8px 10px}
.controls .sp{flex:1}
.prog{padding-left:42px;margin-top:10px;display:flex;flex-direction:column;gap:5px}
.prog .track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.prog.done .track{visibility:hidden}
.prog span{font-size:12px;color:var(--muted)}
.graph{margin:12px 0 0 42px;cursor:pointer;touch-action:none;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.graph svg{display:block;width:100%;height:auto}
.g-bg{fill:var(--g-bg)}.g-fill{fill:var(--g-fill)}
.g-mid{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.g-cur{stroke:var(--accent);stroke-width:2}
.g-dot{fill:var(--k);stroke:var(--g-bg);stroke-width:1}
.comment{margin:12px 0 0 42px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-height:84px}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.cmove{font:500 17px var(--font-m)}
.evnum{margin-left:auto;font:500 13px var(--font-m);color:var(--muted)}
.tag{font-size:12px;font-weight:600;color:var(--k);border:1px solid var(--k);padding:1px 7px;border-radius:3px}
.cbody{margin:8px 0 0}
.muted{color:var(--muted)}.small{font-size:12px}

.k-best{--k:var(--c-best)}.k-excellent{--k:var(--c-excellent)}.k-good{--k:var(--c-good)}.k-book{--k:var(--c-book)}
.k-forced{--k:var(--c-forced)}.k-inacc{--k:var(--c-inacc)}.k-mistake{--k:var(--c-mistake)}.k-blunder{--k:var(--c-blunder)}.k-pending{--k:var(--c-pending)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--k);margin-right:7px;flex:none}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;margin-bottom:-1px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
#panel{min-height:380px}
h3{font-family:var(--font-d);font-weight:600;font-size:15px;margin:20px 0 8px}
#panel>h3:first-child{margin-top:0}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:12px 14px;min-width:0}
.pc-name{display:flex;align-items:center;gap:8px;font-weight:600;overflow-wrap:anywhere}
.pc-name .chip{width:12px;height:12px;border-radius:2px;border:1px solid var(--ink);flex:none}
.pc-name .chip.w{background:#fbfaf4}.pc-name .chip.b{background:#1a2428}
.pc-acc{font:500 34px var(--font-d);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.pc-acc small{font:400 12px var(--font-b);color:var(--muted);margin-left:6px;letter-spacing:0}
.pc-sub{font:500 13px var(--font-m);margin-top:2px}
.pc-sub span{font:400 12px var(--font-b);color:var(--muted)}
table.cls{width:100%;border-collapse:collapse;margin-top:14px;font-variant-numeric:tabular-nums}
table.cls th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:4px 0}
table.cls th:first-child{text-align:left}
table.cls td{padding:6px 0;border-top:1px solid var(--line);text-align:right;font-family:var(--font-m)}
table.cls td:first-child{text-align:left;font-family:var(--font-b);display:flex;align-items:center}
.moments{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mom{width:100%;display:grid;grid-template-columns:auto auto 1fr;gap:4px 12px;align-items:baseline;text-align:left;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--k);border-radius:4px;cursor:pointer}
.mom:hover{border-color:var(--k)}
.mom-mv{font:500 14px var(--font-m)}
.mom-cls{color:var(--k);font-weight:600;font-size:12px}
.mom-best{color:var(--muted);font-size:12px;text-align:right}
.note{margin:0 0 10px}

.sheet{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);position:relative}
.mrow{display:grid;grid-template-columns:34px 1fr 1fr;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mn{padding:8px 0 8px 10px;color:var(--muted);font:400 12px var(--font-m);align-self:center}
.mv{display:flex;align-items:center;justify-content:space-between;gap:6px;background:none;border:0;border-left:1px solid var(--line);padding:8px 10px;cursor:pointer;text-align:left;min-width:0}
.mv.empty{color:var(--muted);cursor:default}
.mv:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.mv[aria-current=true]{background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:inset 0 -2px 0 var(--accent)}
.mv .san{font:500 14px var(--font-m);display:flex;align-items:center;white-space:nowrap}
.mv .san b{font-weight:600;color:var(--k);margin-left:4px;font-size:12px}
.mv .ev{font:400 11px var(--font-m);color:var(--muted);font-variant-numeric:tabular-nums}

.oname{font:600 18px var(--font-d);margin:0 0 6px;text-wrap:balance}
ul.book,ul.cands{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column}
ul.book li{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
ul.book li b{font:500 14px var(--font-m)}
ul.book li span{color:var(--muted);font-size:13px}
ul.book li em{font-style:normal;font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
ul.book li.is-played b{color:var(--accent)}
.cand{width:100%;display:grid;grid-template-columns:70px 1fr 54px;gap:10px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;cursor:pointer;text-align:left}
.cand.on{background:color-mix(in srgb,var(--arrow2) 14%,transparent)}
.cand b{font:500 14px var(--font-m)}
.cbar{height:8px;background:var(--bar-b);border-radius:2px;overflow:hidden;display:block}
.cbar i{display:block;height:100%;background:var(--bar-w)}
.cand .ev{font:500 12px var(--font-m);text-align:right}
.cwrap{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.clabel{font:600 11px var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.comment .cand{grid-template-columns:96px 1fr 54px 52px}
.comment .cand b{display:flex;align-items:center;gap:6px;white-space:nowrap}
.comment .cand em{font-style:normal;font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.comment .cand.is-played b{color:var(--accent)}
.rk{font:600 10px var(--font-m);font-style:normal;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:var(--c-pending)}
.rk.r1{background:var(--arrow)}.rk.r2{background:var(--arrow2)}.rk.r3{background:var(--arrow3)}
.cnote{margin:6px 0 0}
.fenrow{display:flex;gap:8px;align-items:center}
.fenrow code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font:400 11px var(--font-m);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .loader{flex-basis:100%;max-width:none}
  .loader summary{float:none}
}
@media (max-width:480px){
  .pcards{grid-template-columns:1fr}
  .strip,.controls,.prog{padding-left:0}
  .graph,.comment{margin-left:0}
  .sheet{max-height:380px}
  .mom{grid-template-columns:auto 1fr}
  .mom-best{grid-column:1/-1;text-align:left}
}
@media (prefers-reduced-motion:reduce){.evalbar .fill,.prog .track i{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>PGN Game Review</h1>
      <p class="meta" id="meta"></p>
    </div>
    <details class="loader" id="loader">
      <summary>Load another game</summary>
      <div class="loader-body">
        <label class="lbl" for="pgn">PGN</label>
        <textarea id="pgn" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste a PGN from Chess.com or Lichess here"></textarea>
        <div class="row">
          <button class="btn primary" id="go" type="button">Analyze</button>
          <button class="btn" id="sample" type="button">Sample game</button>
          <button class="btn" id="clear" type="button">Clear</button>
          <label for="quality">Depth</label>
          <select id="quality"></select>
          <label for="lines">Lines</label><select id="lines" title="Best moves listed per position"></select>
          <select id="gamesel" aria-label="Game in this PGN" hidden></select>
        </div>
        <p class="err" id="loaderr" hidden></p>
        <p class="hint">Pasting runs the review automatically. Several games in one PGN are listed in a menu.</p>
      </div>
    </details>
  </header>

  <div class="main">
    <section class="left" aria-label="Board">
      <div id="strip-top"></div>
      <div class="boardrow">
        <div class="evalbar" id="evalbar" aria-hidden="true"><div class="fill" id="evalfill"></div><span class="evallab" id="evallab"></span></div>
        <div class="board" id="board"></div>
      </div>
      <div id="strip-bot"></div>
      <div class="controls">
        <button class="btn" id="nav-start" type="button" aria-label="First position">&laquo;</button>
        <button class="btn" id="nav-prev" type="button" aria-label="Previous move">&lsaquo;</button>
        <button class="btn" id="nav-next" type="button" aria-label="Next move">&rsaquo;</button>
        <button class="btn" id="nav-end" type="button" aria-label="Last position">&raquo;</button>
        <button class="btn" id="play" type="button">Play</button>
        <span class="sp"></span>
        <button class="btn" id="aibtn" type="button">AI</button>
        <button class="btn" id="arrows" type="button">Arrows: on</button>
        <button class="btn" id="flip" type="button">Flip</button>
      </div>
      <div class="prog" id="prog"><div class="track"><i id="progfill"></i></div><span id="progtxt"></span></div>
      <div class="graph" id="graph" aria-label="Evaluation graph, click to jump"></div>
      <div class="comment" id="comment" aria-live="polite"></div>
    </section>

    <section class="right" aria-label="Review">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="review" aria-selected="true">Review</button>
        <button role="tab" data-tab="moves" aria-selected="false">Moves</button>
        <button role="tab" data-tab="explorer" aria-selected="false">Explorer</button>
      </div>
      <div id="panel"></div>
    </section>
  </div>
</div>

<dialog id="aidlg"><form method="dialog" class="aiform">
  <h3>AI coach setup</h3>
  <p class="muted small">Optional. The engine works fully offline; this only adds plain-English explanations. Your key stays in this browser and is sent only to the provider you pick.</p>
  <label>Provider<select id="ai-provider"><option value="openai">OpenAI-compatible (OpenAI, OpenRouter, Groq, DeepSeek, Ollama, LM Studio…)</option><option value="anthropic">Anthropic (Claude)</option><option value="gemini">Google Gemini</option></select></label>
  <label>Base URL <span class="muted small">(OpenAI-compatible only; blank = OpenAI)</span><input id="ai-base" placeholder="https://api.openai.com/v1" autocomplete="off"></label>
  <label>Model<input id="ai-model" autocomplete="off"></label>
  <label>API key<input id="ai-key" type="password" autocomplete="off" placeholder="Not needed for local Ollama"></label>
  <div class="aibtns"><button class="btn primary" value="save">Save</button><button class="btn" value="clear">Clear key</button><button class="btn" value="cancel">Cancel</button></div>
</form></dialog>
<script>
function ENGINE(){
'use strict';
const P=1,N=2,B=3,R=4,Q=5,K=6,INF=32000,MATE=30000;
const FILES='abcdefgh';
const KN=[-33,-31,-18,-14,14,18,31,33],KG=[-17,-16,-15,-1,1,15,16,17],BD=[-17,-15,15,17],RD=[-16,-1,1,16],QD=[-17,-16,-15,-1,1,15,16,17];
const VAL=[0,100,320,330,500,900,0];
const CAS=new Int8Array(128).fill(15);
CAS[4]=12;CAS[0]=13;CAS[7]=14;CAS[116]=3;CAS[112]=7;CAS[119]=11;
const START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const PB=[0,0,6,14,28,50,85,0];
const ABORT={};
const S={nodes:0,deadline:Infinity};
const now=()=>(typeof performance!=='undefined'?performance.now():Date.now());
const sqName=s=>FILES[s&7]+((s>>4)+1);
const kidx=c=>c===1?0:1;

function parseFEN(fen){
  const f=fen.trim().split(/\s+/);
  const p={b:new Int8Array(128),side:1,cas:0,ep:-1,half:0,full:1,ks:[0,0],hist:[]};
  const rows=f[0].split('/');
  const map={p:1,n:2,b:3,r:4,q:5,k:6};
  for(let r=0;r<8;r++){
    let file=0;const rank=7-r;
    for(const ch of rows[r]){
      if(ch>='1'&&ch<='8'){file+=+ch;}
      else{
        const lo=ch.toLowerCase();const sq=rank*16+file;
        p.b[sq]=(ch===lo?-1:1)*map[lo];
        if(lo==='k')p.ks[ch===lo?1:0]=sq;
        file++;
      }
    }
  }
  p.side=f[1]==='b'?-1:1;
  const c=f[2]||'-';
  if(c.includes('K'))p.cas|=1;
  if(c.includes('Q'))p.cas|=2;
  if(c.includes('k'))p.cas|=4;
  if(c.includes('q'))p.cas|=8;
  if(f[3]&&f[3]!=='-')p.ep=(+f[3][1]-1)*16+FILES.indexOf(f[3][0]);
  p.half=+f[4]||0;p.full=+f[5]||1;
  return p;
}
function toFEN(p){
  let s='';
  for(let r=7;r>=0;r--){
    let e=0;
    for(let f=0;f<8;f++){
      const v=p.b[r*16+f];
      if(!v){e++;continue;}
      if(e){s+=e;e=0;}
      const ch='pnbrqk'[Math.abs(v)-1];
      s+=v>0?ch.toUpperCase():ch;
    }
    if(e)s+=e;
    if(r)s+='/';
  }
  let cs=(p.cas&1?'K':'')+(p.cas&2?'Q':'')+(p.cas&4?'k':'')+(p.cas&8?'q':'');
  if(!cs)cs='-';
  return s+(p.side===1?' w ':' b ')+cs+' '+(p.ep>=0?sqName(p.ep):'-')+' '+p.half+' '+p.full;
}

function attacked(p,sq,by){
  const b=p.b;let q;
  q=sq-by*15;if(!(q&0x88)&&b[q]===by*P)return true;
  q=sq-by*17;if(!(q&0x88)&&b[q]===by*P)return true;
  for(let i=0;i<8;i++){q=sq+KN[i];if(!(q&0x88)&&b[q]===by*N)return true;}
  for(let i=0;i<8;i++){q=sq+KG[i];if(!(q&0x88)&&b[q]===by*K)return true;}
  for(let i=0;i<4;i++){
    const d=BD[i];q=sq+d;
    while(!(q&0x88)){const v=b[q];if(v!==0){if(v===by*B||v===by*Q)return true;break;}q+=d;}
  }
  for(let i=0;i<4;i++){
    const d=RD[i];q=sq+d;
    while(!(q&0x88)){const v=b[q];if(v!==0){if(v===by*R||v===by*Q)return true;break;}q+=d;}
  }
  return false;
}
function inCheck(p){return attacked(p,p.ks[kidx(p.side)],-p.side);}

function gen(p,caps){
  const mv=[],b=p.b,s=p.side;
  for(let sq=0;sq<120;sq++){
    if(sq&0x88){sq+=7;continue;}
    const v=b[sq];
    if(v===0||(v>0)!==(s>0))continue;
    const t=v>0?v:-v;
    if(t===P){
      const dir=s*16,r=sq>>4,start=s===1?1:6,pr=s===1?6:1;
      let to=sq+dir;
      if(b[to]===0){
        if(r===pr){for(let pp=Q;pp>=N;pp--)mv.push(sq|(to<<7)|(pp<<14));}
        else if(!caps){
          mv.push(sq|(to<<7));
          if(r===start&&b[to+dir]===0)mv.push(sq|((to+dir)<<7)|(8<<17));
        }
      }
      for(let k=-1;k<=1;k+=2){
        to=sq+dir+k;
        if(to&0x88)continue;
        const tv=b[to];
        if(tv!==0&&(tv>0)!==(s>0)){
          if(r===pr){for(let pp=Q;pp>=N;pp--)mv.push(sq|(to<<7)|(pp<<14)|(1<<17));}
          else mv.push(sq|(to<<7)|(1<<17));
        }else if(tv===0&&to===p.ep){
          mv.push(sq|(to<<7)|(3<<17));
        }
      }
    }else if(t===N||t===K){
      const ds=t===N?KN:KG;
      for(let i=0;i<8;i++){
        const to=sq+ds[i];
        if(to&0x88)continue;
        const tv=b[to];
        if(tv===0){if(!caps)mv.push(sq|(to<<7));}
        else if((tv>0)!==(s>0))mv.push(sq|(to<<7)|(1<<17));
      }
      if(t===K&&!caps){
        if(s===1&&sq===4){
          if((p.cas&1)&&b[5]===0&&b[6]===0&&b[7]===R&&!attacked(p,4,-1)&&!attacked(p,5,-1)&&!attacked(p,6,-1))mv.push(4|(6<<7)|(4<<17));
          if((p.cas&2)&&b[3]===0&&b[2]===0&&b[1]===0&&b[0]===R&&!attacked(p,4,-1)&&!attacked(p,3,-1)&&!attacked(p,2,-1))mv.push(4|(2<<7)|(4<<17));
        }else if(s===-1&&sq===116){
          if((p.cas&4)&&b[117]===0&&b[118]===0&&b[119]===-R&&!attacked(p,116,1)&&!attacked(p,117,1)&&!attacked(p,118,1))mv.push(116|(118<<7)|(4<<17));
          if((p.cas&8)&&b[115]===0&&b[114]===0&&b[113]===0&&b[112]===-R&&!attacked(p,116,1)&&!attacked(p,115,1)&&!attacked(p,114,1))mv.push(116|(114<<7)|(4<<17));
        }
      }
    }else{
      const ds=t===B?BD:t===R?RD:QD;
      for(let i=0;i<ds.length;i++){
        const d=ds[i];let to=sq+d;
        while(!(to&0x88)){
          const tv=b[to];
          if(tv===0){if(!caps)mv.push(sq|(to<<7));}
          else{if((tv>0)!==(s>0))mv.push(sq|(to<<7)|(1<<17));break;}
          to+=d;
        }
      }
    }
  }
  return mv;
}

function make(p,m){
  const from=m&127,to=(m>>7)&127,promo=(m>>14)&7,fl=m>>17;
  const b=p.b,s=p.side,pc=b[from];
  const u={m:m,cap:b[to],cas:p.cas,ep:p.ep,half:p.half};
  p.hist.push(u);
  b[to]=promo?s*promo:pc;
  b[from]=0;
  if(fl&2){b[to-s*16]=0;u.cap=-s*P;}
  if(fl&4){
    if(to>from){b[to-1]=b[to+1];b[to+1]=0;}
    else{b[to+1]=b[to-2];b[to-2]=0;}
  }
  const t=pc*s;
  if(t===K)p.ks[kidx(s)]=to;
  p.cas&=CAS[from]&CAS[to];
  p.ep=(fl&8)?from+s*16:-1;
  p.half=(t===P||u.cap!==0)?0:p.half+1;
  if(s===-1)p.full++;
  p.side=-s;
}
function unmake(p){
  const u=p.hist.pop();
  p.side=-p.side;
  const s=p.side,m=u.m,b=p.b;
  const from=m&127,to=(m>>7)&127,promo=(m>>14)&7,fl=m>>17;
  const pc=promo?s*P:b[to];
  b[from]=pc;
  if(fl&2){b[to]=0;b[to-s*16]=u.cap;}
  else b[to]=u.cap;
  if(fl&4){
    if(to>from){b[to+1]=b[to-1];b[to-1]=0;}
    else{b[to-2]=b[to+1];b[to+1]=0;}
  }
  if(pc*s===K)p.ks[kidx(s)]=from;
  p.cas=u.cas;p.ep=u.ep;p.half=u.half;
  if(s===-1)p.full--;
}
function legalMoves(p){
  const ml=gen(p,false),out=[];
  for(let i=0;i<ml.length;i++){
    make(p,ml[i]);
    if(!attacked(p,p.ks[kidx(-p.side)],p.side))out.push(ml[i]);
    unmake(p);
  }
  return out;
}
function uci(m){
  const promo=(m>>14)&7;
  return sqName(m&127)+sqName((m>>7)&127)+(promo?' pnbrq'[promo]:'');
}
function sanOf(p,m,legal,suffix){
  const from=m&127,to=(m>>7)&127,promo=(m>>14)&7,fl=m>>17;
  const pc=Math.abs(p.b[from]);
  let s;
  if(fl&4)s=to>from?'O-O':'O-O-O';
  else if(pc===P){
    s='';
    if(fl&1)s=FILES[from&7]+'x';
    s+=sqName(to);
    if(promo)s+='='+' PNBRQK'[promo];
  }else{
    s=' PNBRQK'[pc];
    let amb=false,sameF=false,sameR=false;
    for(let i=0;i<legal.length;i++){
      const o=legal[i];
      if(o===m)continue;
      if(((o>>7)&127)!==to)continue;
      const of=o&127;
      if(Math.abs(p.b[of])!==pc)continue;
      amb=true;
      if((of&7)===(from&7))sameF=true;
      if((of>>4)===(from>>4))sameR=true;
    }
    if(amb){
      if(!sameF)s+=FILES[from&7];
      else if(!sameR)s+=(from>>4)+1;
      else s+=FILES[from&7]+((from>>4)+1);
    }
    if(fl&1)s+='x';
    s+=sqName(to);
  }
  if(suffix){
    make(p,m);
    if(inCheck(p))s+=legalMoves(p).length?'+':'#';
    unmake(p);
  }
  return s;
}

function evalW(p){
  const b=p.b;
  let nonP=0;
  const bmax=[-1,-1,-1,-1,-1,-1,-1,-1],wmin=[8,8,8,8,8,8,8,8];
  for(let sq=0;sq<120;sq++){
    if(sq&0x88){sq+=7;continue;}
    const v=b[sq];
    if(!v)continue;
    const t=v>0?v:-v;
    if(t===P){
      const f=sq&7,r=sq>>4;
      if(v>0){if(r<wmin[f])wmin[f]=r;}
      else if(r>bmax[f])bmax[f]=r;
    }else if(t!==K)nonP+=VAL[t];
  }
  const endg=nonP<=2600;
  let sc=0,wB=0,bB=0;
  for(let sq=0;sq<120;sq++){
    if(sq&0x88){sq+=7;continue;}
    const v=b[sq];
    if(!v)continue;
    const t=v>0?v:-v,c=v>0?1:-1;
    const f=sq&7,rank=sq>>4,rr=c===1?rank:7-rank;
    const cf=f<4?f:7-f,cr=rank<4?rank:7-rank,ctr=cf+cr;
    let x;
    switch(t){
      case P:{
        x=100+rr*8+(cf>=2?rr*2:0);
        let passed=true;
        const g0=f>0?f-1:0,g1=f<7?f+1:7;
        for(let g=g0;g<=g1;g++){
          if(c===1?bmax[g]>rank:wmin[g]<rank){passed=false;break;}
        }
        if(passed)x+=PB[rr];
        break;
      }
      case N:x=320+ctr*8-(rr===0?8:0);break;
      case B:x=330+ctr*4-(rr===0?5:0);if(c===1)wB++;else bB++;break;
      case R:x=500+(rr===6?18:0);break;
      case Q:x=900+ctr*2;break;
      default:x=endg?ctr*10:(rr===0?((f<=2||f>=6)?25:0):-rr*10);
    }
    sc+=c*x;
  }
  if(wB>=2)sc+=25;
  if(bB>=2)sc-=25;
  return sc;
}
const evalStm=p=>p.side===1?evalW(p):-evalW(p);

function order(p,mv){
  const sc=new Array(mv.length);
  for(let i=0;i<mv.length;i++){
    const m=mv[i],to=(m>>7)&127,from=m&127;
    let s=0;
    const cap=p.b[to];
    if(cap!==0)s=10000+VAL[cap>0?cap:-cap]*10-VAL[Math.abs(p.b[from])];
    else if((m>>17)&2)s=10900;
    const pr=(m>>14)&7;
    if(pr)s+=pr===Q?9000:100;
    sc[i]=s;
  }
  return sc;
}
function pick(mv,sc,i){
  let bi=i,bs=sc[i];
  for(let j=i+1;j<mv.length;j++)if(sc[j]>bs){bs=sc[j];bi=j;}
  if(bi!==i){
    const tm=mv[i];mv[i]=mv[bi];mv[bi]=tm;
    const ts=sc[i];sc[i]=sc[bi];sc[bi]=ts;
  }
  return mv[i];
}

function qs(p,alpha,beta,ply,qd){
  if((++S.nodes&1023)===0&&now()>S.deadline)throw ABORT;
  if(p.half>=100)return 0;
  const chk=inCheck(p);
  let bestv=-INF;
  if(!chk){
    const e=evalStm(p);
    if(e>=beta)return e;
    if(e>alpha)alpha=e;
    bestv=e;
  }else if(qd>=6)return evalStm(p);
  const mv=gen(p,!chk),sc=order(p,mv);
  let legal=0;
  for(let i=0;i<mv.length;i++){
    const m=pick(mv,sc,i);
    make(p,m);
    if(attacked(p,p.ks[kidx(-p.side)],p.side)){unmake(p);continue;}
    legal++;
    const v=-qs(p,-beta,-alpha,ply+1,qd+1);
    unmake(p);
    if(v>bestv){bestv=v;if(v>alpha){alpha=v;if(alpha>=beta)break;}}
  }
  if(chk&&legal===0)return -(MATE-ply);
  return bestv;
}
function nega(p,depth,alpha,beta,ply){
  if((++S.nodes&1023)===0&&now()>S.deadline)throw ABORT;
  if(p.half>=100)return 0;
  const chk=inCheck(p);
  if(chk&&ply<12)depth++;
  if(depth<=0)return qs(p,alpha,beta,ply,0);
  const mv=gen(p,false),sc=order(p,mv);
  let legal=0,bestv=-INF;
  for(let i=0;i<mv.length;i++){
    const m=pick(mv,sc,i);
    make(p,m);
    if(attacked(p,p.ks[kidx(-p.side)],p.side)){unmake(p);continue;}
    legal++;
    const v=-nega(p,depth-1,-beta,-alpha,ply+1);
    unmake(p);
    if(v>bestv){bestv=v;if(v>alpha){alpha=v;if(alpha>=beta)break;}}
  }
  if(legal===0)return chk?-(MATE-ply):0;
  return bestv;
}

function rootOrder(p,legal,first){
  const sc=order(p,legal);
  const arr=legal.map((m,i)=>[sc[i],m]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  return first===undefined?arr:[first].concat(arr.filter(m=>m!==first));
}
function best(fen,ms,maxDepth){
  const p=parseFEN(fen),legal=legalMoves(p),chk=inCheck(p);
  if(!legal.length)return {terminal:true,mate:chk,score:chk?-MATE:0,stm:p.side};
  let bm=legal[0],bs=0,bd=0;
  const t0=now(),h0=p.hist.length;
  for(let d=1;d<=maxDepth;d++){
    S.deadline=d===1?Infinity:t0+ms;
    S.nodes=0;
    try{
      const ordered=rootOrder(p,legal,d===1?undefined:bm);
      let alpha=-INF,cur=null,curS=-INF;
      for(const m of ordered){
        make(p,m);
        const v=-nega(p,d-1,-INF,-alpha,1);
        unmake(p);
        if(cur===null||v>curS){curS=v;cur=m;}
        if(v>alpha)alpha=v;
      }
      bm=cur;bs=curS;bd=d;
      if(Math.abs(bs)>MATE-100)break;
      if(legal.length===1&&d>=3)break;
    }catch(e){
      if(e!==ABORT)throw e;
      while(p.hist.length>h0)unmake(p);
      break;
    }
  }
  return {move:uci(bm),san:sanOf(p,bm,legal,true),score:bs,depth:bd,stm:p.side};
}
function multi(fen,maxDepth,ms){
  const p=parseFEN(fen),legal=legalMoves(p);
  if(!legal.length)return {lines:[],depth:0,stm:p.side};
  let lines=legal.map(m=>({m:m,s:0})),done=0;
  const t0=now(),h0=p.hist.length;
  for(let d=1;d<=maxDepth;d++){
    S.deadline=d<=2?Infinity:t0+ms;
    S.nodes=0;
    try{
      const prev=lines.map(x=>x.m);
      const ordered=d===1?rootOrder(p,legal):prev;
      const cur=[];
      for(const m of ordered){
        make(p,m);
        const v=-nega(p,d-1,-INF,INF,1);
        unmake(p);
        cur.push({m:m,s:v});
      }
      cur.sort((a,b)=>b.s-a.s);
      lines=cur;done=d;
    }catch(e){
      if(e!==ABORT)throw e;
      while(p.hist.length>h0)unmake(p);
      break;
    }
  }
  return {depth:done,stm:p.side,lines:lines.slice(0,6).map(x=>({move:uci(x.m),san:sanOf(p,x.m,legal,true),score:x.s}))};
}
function top(fen,ms,maxDepth,n){
  // Multi-line search: the n best root moves, each with an exact score.
  // A root move only needs a full search while it can still beat the current n-th best.
  const p=parseFEN(fen),legal=legalMoves(p),chk=inCheck(p);
  if(!legal.length)return {terminal:true,mate:chk,score:chk?-MATE:0,stm:p.side,lines:[]};
  n=Math.max(1,Math.min(n||3,legal.length));
  let lines=null,bd=0,order=null;
  const t0=now(),h0=p.hist.length;
  for(let d=1;d<=maxDepth;d++){
    S.deadline=d===1?Infinity:t0+ms;
    S.nodes=0;
    try{
      const ordered=order||rootOrder(p,legal);
      const cur=[];
      for(const m of ordered){
        const alpha=cur.length<n?-INF:cur[n-1].s;
        make(p,m);
        const v=-nega(p,d-1,-INF,-alpha,1);
        unmake(p);
        if(cur.length<n||v>alpha){
          let i=cur.length;
          while(i>0&&cur[i-1].s<v)i--;
          cur.splice(i,0,{m:m,s:v});
          if(cur.length>n)cur.pop();
        }
      }
      lines=cur;bd=d;
      order=cur.map(x=>x.m).concat(ordered.filter(m=>!cur.some(x=>x.m===m)));
      if(Math.abs(cur[0].s)>MATE-100)break;
      if(legal.length===1&&d>=3)break;
    }catch(e){
      if(e!==ABORT)throw e;
      while(p.hist.length>h0)unmake(p);
      break;
    }
  }
  return {move:uci(lines[0].m),san:sanOf(p,lines[0].m,legal,true),score:lines[0].s,depth:bd,stm:p.side,
    lines:lines.map(x=>({move:uci(x.m),san:sanOf(p,x.m,legal,true),score:x.s}))};
}
function movesFrom(fen){
  const p=parseFEN(fen);
  return legalMoves(p).map(m=>({uci:uci(m),from:sqName(m&127),to:sqName((m>>7)&127)}));
}
function play(fen,u){
  const p=parseFEN(fen),legal=legalMoves(p);
  for(const m of legal){
    if(uci(m)===u){
      const san=sanOf(p,m,legal,true),from=sqName(m&127),to=sqName((m>>7)&127);
      make(p,m);
      return {uci:u,san:san,from:from,to:to,fen:toFEN(p)};
    }
  }
  return null;
}
function perft(fen,d){
  const p=parseFEN(fen);
  const go=n=>{
    if(n===0)return 1;
    const ml=legalMoves(p);
    if(n===1)return ml.length;
    let c=0;
    for(const m of ml){make(p,m);c+=go(n-1);unmake(p);}
    return c;
  };
  return go(d);
}

const normKey=s=>s.replace(/0/g,'O').replace(/e\.p\./,'').replace(/[+#!?x=:\-]/g,'');
function altKeys(p,m){
  const from=m&127,to=(m>>7)&127,pc=Math.abs(p.b[from]);
  if(pc===P||pc===K)return [];
  const L=' PNBRQK'[pc],f=FILES[from&7],r=String((from>>4)+1),t=sqName(to);
  return [L+f+t,L+r+t,L+f+r+t];
}
function cleanMovetext(text){
  let t=text.replace(/\{[^}]*\}/g,' ').replace(/;[^\n]*/g,' ');
  let prev;
  do{prev=t;t=t.replace(/\([^()]*\)/g,' ');}while(t!==prev);
  t=t.replace(/\$\d+/g,' ').replace(/\d+\.+/g,' ');
  return t.split(/\s+/).filter(x=>x&&!/^(1-0|0-1|1\/2-1\/2|\*)$/.test(x));
}
function parseGame(text){
  const hdr={};
  const body=text.replace(/\[(\w+)\s+"((?:[^"\\]|\\.)*)"\s*\]/g,(m,k,v)=>{hdr[k]=v;return ' ';});
  const start=(hdr.FEN&&hdr.SetUp!=='0')?hdr.FEN:START;
  const p=parseFEN(start);
  const fens=[toFEN(p)],plies=[];
  const tokens=cleanMovetext(body);
  let error=null;
  for(const tok of tokens){
    const legal=legalMoves(p);
    const key=normKey(tok);
    let found=null;
    for(const m of legal){if(normKey(sanOf(p,m,legal,false))===key){found=m;break;}}
    if(found===null){
      for(const m of legal){if(altKeys(p,m).some(a=>normKey(a)===key)){found=m;break;}}
    }
    if(found===null){error={ply:plies.length+1,token:tok};break;}
    const from=found&127,to=(found>>7)&127;

/* ---------- helpers ---------- */
const winPct=cp=>50+50*(2/(1+Math.exp(-0.00368208*cp))-1);

function derive(){

      const played=k<g.plies.length?skey(g.plies[k].san):null;
      h+=`<p class="muted small">${k===0?'First moves in the built-in opening table.':'Position is in the built-in opening table. Continuations:'}</p>`;
      if(kids.length)h+='<ul class="book">'+kids.map(x=>`<li class="${x===played?'is-played':''}"><b>${esc(x)}</b><span>${esc(nearName(nd.kids[x]))}</span>${x===played?'<em>played</em>':''}</li>`).join('')+'</ul>';
      else h+='<p class="muted small">End of the listed lines.</p>';
    }else{
      let kk=k;while(kk>0&&!g.bookNodes[kk])kk--;
      h+=`<p class="muted small">${kk===0?'Out of the opening table from the first move.':'Out of the opening table after '+esc(moveLabel(kk-1))+'.'} The table covers common first moves only, not full theory.</p>`;
    }
  }
  h+=`<h3>Top moves · ${stmOf(c.fen)===1?'White':'Black'} to play</h3>`+candList(c);
  const ev=A.deep.get(c.fen)||c.ev,deepDone=A.deep.has(c.fen);
  if(ev&&!ev.terminal&&!deepDone)h+=`<p><button class="btn" id="calc" type="button"${A.calc?' disabled':''}>${A.calc?'Searching deeper…':'Search deeper (6 moves)'}</button></p>`;
  h+='<p class="muted small">Tap any piece on the board, then a square, to try your own move. Pawns promote to a queen.</p>';
  h+=`<h3>Position</h3><div class="fenrow"><code id="fen">${esc(c.fen)}</code><button class="btn" id="copyfen">Copy</button></div>`;
  return h;
}
async function calcDeep(){
  if(A.calc)return;
  const c=cur(),g=A.game;
  A.calc=true;renderPanel();
  try{
    const r=await call('top',{fen:c.fen,ms:2500,depth:14,n:6});
    A.deep.set(c.fen,normEval(r,c.fen));
  }catch(e){}
  A.calc=false;
  if(A.game===g){renderBoard();renderComment();renderPanel();}
}
/* ---------- moving pieces on the board ---------- */
function boardTap(sq){
  const c=cur();stopPlay();
  if(A.sel){
    const m=A.dests.find(d=>d.to===sq&&(!d.uci[4]||d.uci[4]==='q'));
    if(m){makeMove(m.uci,c);return;}
  }
  const ch=parseBoard(c.fen)[8-(+sq[1])][FILES.indexOf(sq[0])];
  const white=stmOf(c.fen)===1;
  if(ch&&((ch===ch.toUpperCase())===white)&&A.sel!==sq){
    A.sel=sq;A.dests=EN.moves(c.fen).filter(m=>m.from===sq);
  }else{A.sel=null;A.dests=[];}
  A.hint=null;
  renderBoard();
}
function makeMove(u,c){
  const res=EN.play(c.fen,u);
  if(!res)return;
  const g=A.game;
  A.sel=null;A.dests=[];A.hint=null;
  if(!c.line&&A.ply<g.plies.length&&g.plies[A.ply].uci===u){go(A.ply+1,true);return;}
  const step={uci:u,san:res.san,from:res.from,to:res.to,fen:res.fen};
  const L=A.line;
  if(c.line){
    const nx=L.steps[L.idx];
    if(!(nx&&nx.uci===u)){L.steps=L.steps.slice(0,L.idx);L.steps.push(step);}
    L.idx++;
  }else if(L&&L.base===A.ply&&L.steps[0]&&L.steps[0].uci===u){L.idx=1;}
  else A.line={base:A.ply,steps:[step],idx:1};
  refreshView();
}
function navPrev(){
  if(A.line&&A.line.idx>0){A.line.idx--;A.sel=null;A.dests=[];A.hint=null;refreshView();}
  else go(A.ply-1);
}
function navNext(){
  if(A.line&&A.line.idx<A.line.steps.length){A.line.idx++;A.sel=null;A.dests=[];A.hint=null;refreshView();}
  else go(A.ply+1);
}
/* ---------- JSON export (same shape as the CLI / HTTP API) ---------- */
function exportJSON(){
  const g=A.game,st=stats();
  const pe=e=>!e?null:e.terminal?{cp:0,mate:null,checkmate:e.mated?(e.mate>0?'white':'black'):null}:{cp:e.mate===null?e.w:null,mate:e.mate};
  const nm=c=>c==='inacc'?'inaccuracy':c;
  const side=(c,key)=>{
    const counts={};
    for(const k in st[c].cls)counts[nm(k)]=st[c].cls[k];
    return {player:g.hdr[key]||null,accuracy:st[c].accAvg===null?null:+st[c].accAvg.toFixed(1),averageCentipawnLoss:st[c].acpl===null?null:Math.round(st[c].acpl),counts};
  };
  return {
    headers:g.hdr,opening:g.open[g.open.length-1],parseError:g.error,
    engine:{name:'pgn-review built-in',msPerPosition:QUAL[A.quality].ms,maxDepth:QUAL[A.quality].depth,lines:A.lines},
    summary:{white:side('1','White'),black:side('-1','Black')},
    moves:g.plies.map((pl,k)=>{
      const m=A.moves[k],e0=A.evals[k],e1=A.evals[k+1];
      const off=g.plies[0].color===-1?1:0;
      return {ply:k+1,moveNumber:g.firstFull+Math.floor((k+off)/2),color:pl.color===1?'white':'black',san:pl.san,uci:pl.uci,
        class:m?nm(m.cls):null,candidates:e0?e0.lines.map(l=>({move:l.move,san:l.san,cp:l.mate===null?l.w:null,mate:l.mate,played:l.move===pl.uci})):null,evalBefore:pe(e0),evalAfter:pe(e1),bestMove:e0?e0.best:null,bestMoveSan:e0?e0.bestSan:null,
        winChanceBefore:m?+m.w0.toFixed(1):null,winChanceAfter:m?+m.w1.toFixed(1):null,centipawnLoss:m?Math.round(m.cpLoss):null,
        accuracy:m?+m.acc.toFixed(1):null,opening:g.open[k+1]};
    })
  };
}

/* ---------- navigation ---------- */
function go(k,follow){
  const n=A.game.plies.length;
  k=Math.max(0,Math.min(n,k));
  const had=!!A.line;
  A.line=null;A.sel=null;A.dests=[];
  if(k===A.ply&&follow===undefined&&!had)return;
  A.ply=k;A.hint=null;A.follow=follow!==false;
  renderStrips();renderBoard();renderBar();renderGraph();renderComment();renderPanel();
}
function stopPlay(){
  A.playing=false;clearInterval(A.timer);A.timer=null;
  const b=$('#play');if(b)b.textContent='Play';
}
function togglePlay(){
  if(A.playing){stopPlay();return;}
  if(A.ply>=A.game.plies.length)go(0);
  A.playing=true;$('#play').textContent='Pause';
  A.timer=setInterval(()=>{
    if(A.ply>=A.game.plies.length){stopPlay();return;}
    go(A.ply+1);
  },950);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const pl=t.closest&&t.closest('[data-ply]');
  if(pl){stopPlay();go(+pl.dataset.ply,false);return;}
  const hint=t.closest&&t.closest('[data-hint]');
  if(hint){A.hint=A.hint===hint.dataset.hint?null:hint.dataset.hint;renderBoard();renderComment();renderPanel();return;}
  const tab=t.closest&&t.closest('[data-tab]');
  if(tab){A.tab=tab.dataset.tab;A.follow=true;renderPanel();return;}
  if(t.id==='calc'){calcDeep();return;}
  if(t.id==='aiexplain'){aiExplain();return;}
  if(t.id==='exitline'){A.line=null;A.sel=null;A.dests=[];A.hint=null;renderStrips();renderBoard();renderBar();renderGraph();renderComment();renderPanel();return;}
  if(t.id==='copyjson'){
    const txt=JSON.stringify(exportJSON(),null,2);
    const done=ok=>{t.textContent=ok?'Copied':'Copy not allowed here';setTimeout(()=>{t.textContent='Copy analysis as JSON';},1800);};
    try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false));}catch(err){done(false);}
    return;
  }
  if(t.id==='copyfen'){
    const txt=cur().fen;
    const fallback=()=>{const r=document.createRange();r.selectNodeContents($('#fen'));const s=getSelection();s.removeAllRanges();s.addRange(r);};
    try{navigator.clipboard.writeText(txt).then(()=>{t.textContent='Copied';setTimeout(()=>{t.textContent='Copy';},1200);},fallback);}catch(err){fallback();}
  }
});
$('#nav-start').onclick=()=>{stopPlay();go(0);};
$('#nav-prev').onclick=()=>{stopPlay();navPrev();};
$('#nav-next').onclick=()=>{stopPlay();navNext();};
$('#nav-end').onclick=()=>{stopPlay();go(A.game.plies.length);};
$('#play').onclick=togglePlay;
$('#flip').onclick=()=>{A.flip=!A.flip;renderAll();};
$('#board').addEventListener('click',e=>{
  const svg=$('#board svg');if(!svg||!A.game)return;
  const r=svg.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*8),y=Math.floor((e.clientY-r.top)/r.height*8);
  if(x<0||x>7||y<0||y>7)return;
  boardTap(FILES[A.flip?7-x:x]+(8-(A.flip?7-y:y)));
});
$('#aibtn').onclick=openAiDialog;
$('#ai-provider').onchange=e=>{$('#ai-model').placeholder=AI_DEFAULTS[e.target.value].model;};
$('#aidlg').addEventListener('close',()=>{
  const v=$('#aidlg').returnValue;
  if(v==='save')aiSave({provider:$('#ai-provider').value,base:$('#ai-base').value.trim(),model:$('#ai-model').value.trim(),key:$('#ai-key').value.trim()});
  else if(v==='clear'){const c=aiLoad();c.key='';aiSave(c);}
  renderComment();
});
$('#arrows').onclick=()=>{A.arrows=!A.arrows;$('#arrows').textContent='Arrows: '+(A.arrows?'on':'off');renderBoard();};
$('#lines').onchange=e=>{A.lines=+e.target.value;if(A.games.length)openGame(A.gi);};
$('#go').onclick=loadFromText;
$('#sample').onclick=()=>{$('#pgn').value=SAMPLE;loadFromText();};
$('#clear').onclick=()=>{$('#pgn').value='';$('#pgn').focus();};
$('#pgn').addEventListener('paste',()=>setTimeout(loadFromText,60));
$('#pgn').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();loadFromText();}});
$('#gamesel').onchange=e=>{stopPlay();openGame(+e.target.value);};
$('#quality').onchange=e=>{A.quality=e.target.value;if(A.games.length)openGame(A.gi);};
document.addEventListener('keydown',e=>{
  const tg=e.target.tagName;
  if(tg==='TEXTAREA'||tg==='INPUT'||tg==='SELECT'||!A.game)return;
  if(e.key==='ArrowLeft'){e.preventDefault();stopPlay();navPrev();}
  else if(e.key==='ArrowRight'){e.preventDefault();stopPlay();navNext();}
  else if(e.key==='Home'){e.preventDefault();stopPlay();go(0);}
  else if(e.key==='End'){e.preventDefault();stopPlay();go(A.game.plies.length);}
  else if(e.key==='f'){A.flip=!A.flip;renderAll();}
});
(function(){
  const g=$('#graph');let down=false;
  const at=ev=>{
    const r=g.getBoundingClientRect(),n=A.game.plies.length;
    const k=Math.round((ev.clientX-r.left)/r.width*n);
    stopPlay();go(k,true);
  };
  g.addEventListener('pointerdown',ev=>{down=true;try{g.setPointerCapture(ev.pointerId);}catch(e){}at(ev);});
  g.addEventListener('pointermove',ev=>{if(down)at(ev);});
  g.addEventListener('pointerup',()=>{down=false;});
  g.addEventListener('pointercancel',()=>{down=false;});
})();

/* ---------- init ---------- */
$('#quality').innerHTML=Object.keys(QUAL).map(k=>`<option value="${k}"${k===A.quality?' selected':''}>${QUAL[k].label}</option>`).join('');
$('#lines').innerHTML=[1,2,3,4,5].map(n=>`<option value="${n}"${n===A.lines?' selected':''}>${n}</option>`).join('');
initWorker();
let saved='';
try{saved=localStorage.getItem('pgnreview.pgn')||'';}catch(e){}
$('#pgn').value=saved.trim()?saved:SAMPLE;
loadFromText();
})();

</script>
